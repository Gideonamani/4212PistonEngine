name: Validate and publish engine explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request cancels the older run; runs on main queue so a deploy is never cut off half way.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides how much a pull request needs. A push to main and a manual run always take the full run, because they publish.
  # A pull request whose changes are all Markdown or ignore files (the light set below) takes only the documentation test: the
  # model audits, the application build and the browser tests cannot be affected by it.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" | tee changed.txt
            # The light set: Markdown under docs, cad-studies, cad_pipeline and .agents or at the top level, and the ignore and attribute files.
            # Anything else (code, data, models, tests, the workflow itself, web/) takes the full run.
            if [ -s changed.txt ] && ! grep -v -E '^((docs|cad-studies|cad_pipeline|\.agents)/.*|[^/]+)\.md$|^\.gitignore$|^\.gitattributes$' changed.txt | grep -q .; then
              full=false
            fi
          fi
          echo "Full run: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  # The documentation test is the only check that reads Markdown, so a light pull request still has to pass it.
  docs:
    needs: scope
    if: needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that the guides point only at things that exist
        run: node --test scripts/test_docs_fresh.mjs

  # The full run is the jobs below, side by side: assets first, then checks, audit and e2e (one job per viewport) together, and on
  # a push to main the Pages artifact. Each job is much shorter than the one job this replaced, which took up to 30 minutes.
  #
  # The Drive-hosted test models (ignored by Git) are restored here once and saved to the cache, so the jobs that need them find
  # them there. Without this step, a changed manifest would send every one of them to Drive at the same moment.
  assets:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Drive-hosted model assets
        uses: actions/cache@v4
        with:
          path: |
            web/*.glb
            web/*.glb.gz
          key: drive-models-${{ hashFiles('docs/drive-asset-manifest.json') }}
      - name: Restore and verify Drive-hosted model assets for tests
        run: python3 scripts/fetch_drive_assets.py

  # Type checks, the JavaScript tests and the Python checks that need no CAD tooling.
  checks:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Type-check the React application and the browser tests
        run: npm run lint
      - name: Run every JavaScript test
        run: npm test
      - name: Verify the published engine contract and asset binding
        run: |
          python3 scripts/package_full_engine_transport.py --check
          python3 scripts/test_engine_contract.py
          python3 scripts/test_m4_engine_foundation.py
      - name: Verify the published operating-cylinder profile and asset binding
        run: python3 scripts/test_cylinder_motion_profile.py
      - name: Verify the accessory gear train (standard library only)
        run: python3 scripts/test_gear_geometry.py
      - name: Verify the Wright reconstruction layout, seats and motion (standard library only)
        run: python3 scripts/test_wright_layout.py
      - name: Verify the Langley reconstruction research, motion and layout (standard library only)
        run: |
          python3 scripts/test_langley_research.py
          python3 scripts/test_langley_motion.py

  # Parts may touch but not overlap, at the assembled pose and through every baked motion. Each model's interference-policy.json
  # is a ratchet: new overlaps fail, and a fixed overlap must be removed from the ledger. This is the longest check apart from the
  # browser tests (about 4 to 7 minutes), and it needs no Node.
  audit:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          node: 'false'
      - name: Install the interference-audit dependencies
        run: python3 -m pip install -r scripts/requirements-audit.txt
      - name: Self-test the interference audit on gear trains that mesh and gear trains that do not
        run: python3 scripts/test_assembly_audit.py
      - name: Audit the published models for part interference
        run: |
          python3 scripts/audit_assembly_interference.py web/accessory-drives.glb.gz --contract web/accessory-drives-contract.json --policy cad-studies/accessory-drives/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/cylinder-reviewed-20261001.glb.gz --policy cad-studies/cylinder/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/hydraulic-tappet.glb.gz --policy cad-studies/hydraulic-tappet/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/oil-pump.glb.gz --policy cad-studies/oil-pump/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/wright-1903-reconstruction.glb.gz --contract web/wright-1903-reconstruction-contract.json --policy cad-studies/wright-1903/revision-2/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/langley-manly-balzer-1903.glb.gz --contract web/langley-manly-balzer-1903-contract.json --policy cad-studies/langley-manly-balzer-1903/interference-policy.json

  # The browser tests, one job for each project in playwright.config.ts (a phone width or the tablet width). Each job builds the
  # site because some tests run against the production bundle on port 4174, and all of them reach the models restored into web/.
  e2e:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every viewport report, so one failure does not hide another.
      fail-fast: false
      matrix:
        project: [phone-320, phone-360, phone-390, tablet-768]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Build the GitHub Pages application
        run: npm run build
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests at ${{ matrix.project }}
        run: npm run e2e -- --project=${{ matrix.project }}
      - name: Keep the browser test traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  # What a push to main publishes: the production build, as a Pages artifact for the deploy job. A pull request does not build it
  # here (the browser tests build it themselves).
  site:
    needs: assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Build the GitHub Pages application
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The one check branch protection requires ("verify"). It passes when everything that applied has passed: for a full run the
  # assets, checks, audit and every browser-test job (and, on a push to main, the site build); for a light pull request the
  # documentation test. A failed, cancelled or missing job fails it.
  verify:
    needs: [scope, assets, checks, audit, e2e, site, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that applied
        env:
          EVENT: ${{ github.event_name }}
          FULL_SCOPE: ${{ needs.scope.outputs.full }}
          SCOPE: ${{ needs.scope.result }}
          ASSETS: ${{ needs.assets.result }}
          CHECKS: ${{ needs.checks.result }}
          AUDIT: ${{ needs.audit.result }}
          E2E: ${{ needs.e2e.result }}
          SITE: ${{ needs.site.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "scope=$SCOPE (full run: $FULL_SCOPE) assets=$ASSETS checks=$CHECKS audit=$AUDIT e2e=$E2E site=$SITE docs=$DOCS"
          [ "$SCOPE" = "success" ] || { echo "The scope job did not succeed"; exit 1; }
          if [ "$FULL_SCOPE" = "true" ]; then
            required="assets=$ASSETS checks=$CHECKS audit=$AUDIT e2e=$E2E"
            # Only a push to main or a manual run builds the Pages artifact.
            [ "$EVENT" = "pull_request" ] || required="$required site=$SITE"
            for job in $required; do
              [ "${job#*=}" = "success" ] || { echo "Did not succeed: ${job%%=*} (${job#*=})"; exit 1; }
            done
          else
            [ "$DOCS" = "success" ] || { echo "The documentation test did not succeed ($DOCS)"; exit 1; }
          fi
          echo "Everything that applied has passed"

  deploy:
    # Publishes what the site job built, on a push to main or a manual run. The condition names the results it needs: by default a
    # job is skipped when any job upstream of it was skipped, and the documentation test (upstream of "verify") is always skipped on
    # a full run, which once silently stopped every deploy.
    if: ${{ always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.site.result == 'success' }}
    needs: [verify, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
