name: Validate and publish engine explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web application dependencies
        run: npm ci
      - name: Type-check the React application
        run: npm run lint
      - name: Run every JavaScript test
        run: node --test scripts/test_*.mjs
      - name: Verify the published engine contract and asset binding
        run: |
          python3 scripts/package_full_engine_transport.py --check
          python3 scripts/test_engine_contract.py
          python3 scripts/test_m4_engine_foundation.py
      - name: Verify the published operating-cylinder profile and asset binding
        run: python3 scripts/test_cylinder_motion_profile.py
      - name: Build the GitHub Pages application
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
