name: Validate and publish engine explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request cancels the older run; runs on main queue so a deploy is never cut off half way.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides how much a pull request needs. A push to main and a manual run always take the full run, because they publish.
  # A pull request whose changes are all Markdown or ignore files (the light set below) takes only the documentation test: the
  # model audits, the application build and the browser tests cannot be affected by it.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" | tee changed.txt
            # The light set: Markdown under docs, cad-studies, cad_pipeline and .agents or at the top level, and the ignore and attribute files.
            # Anything else (code, data, models, tests, the workflow itself, web/) takes the full run.
            if [ -s changed.txt ] && ! grep -v -E '^((docs|cad-studies|cad_pipeline|\.agents)/.*|[^/]+)\.md$|^\.gitignore$|^\.gitattributes$' changed.txt | grep -q .; then
              full=false
            fi
          fi
          echo "Full run: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  # The documentation test is the only check that reads Markdown, so a light pull request still has to pass it.
  docs:
    needs: scope
    if: needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that the guides point only at things that exist
        run: node --test scripts/test_docs_fresh.mjs

  # The one check branch protection requires ("verify"). It passes when the run it needed has passed: the full run, or the
  # documentation test for a light pull request. A failed, cancelled or missing run fails it.
  verify:
    needs: [scope, full, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the run that applied
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.full.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "scope=$SCOPE full=$FULL docs=$DOCS"
          [ "$SCOPE" = "success" ] || { echo "The scope job did not succeed"; exit 1; }
          for result in "$FULL" "$DOCS"; do
            case "$result" in success|skipped) ;; *) echo "A required run ended as: $result"; exit 1;; esac
          done
          [ "$FULL" = "success" ] || [ "$DOCS" = "success" ] || { echo "Neither the full run nor the documentation test ran"; exit 1; }

  # Everything a change must pass. Pull requests stop here; a push to main also publishes what this job built.
  full:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Runs take 12 to 30 minutes depending on the runner; a run on main finished 10 seconds short of the old 30-minute limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web application dependencies
        run: npm ci
      - name: Cache Drive-hosted model assets
        uses: actions/cache@v4
        with:
          path: |
            web/*.glb
            web/*.glb.gz
          key: drive-models-${{ hashFiles('docs/drive-asset-manifest.json') }}
      - name: Restore and verify Drive-hosted model assets for tests
        run: python3 scripts/fetch_drive_assets.py
      - name: Type-check the React application and the browser tests
        run: npm run lint
      - name: Run every JavaScript test
        run: npm test
      - name: Verify the published engine contract and asset binding
        run: |
          python3 scripts/package_full_engine_transport.py --check
          python3 scripts/test_engine_contract.py
          python3 scripts/test_m4_engine_foundation.py
      - name: Verify the published operating-cylinder profile and asset binding
        run: python3 scripts/test_cylinder_motion_profile.py
      - name: Verify the accessory gear train (standard library only)
        run: python3 scripts/test_gear_geometry.py
      - name: Verify the Wright reconstruction layout, seats and motion (standard library only)
        run: python3 scripts/test_wright_layout.py
      - name: Verify the Langley reconstruction research, motion and layout (standard library only)
        run: |
          python3 scripts/test_langley_research.py
          python3 scripts/test_langley_motion.py
      - name: Install the interference-audit dependencies
        run: python3 -m pip install -r scripts/requirements-audit.txt
      - name: Self-test the interference audit on gear trains that mesh and gear trains that do not
        run: python3 scripts/test_assembly_audit.py
      - name: Audit the published models for part interference
        # Parts may touch but not overlap, at the assembled pose and through every baked motion. Each model's
        # interference-policy.json is a ratchet: new overlaps fail, and a fixed overlap must be removed from the ledger.
        run: |
          python3 scripts/audit_assembly_interference.py web/accessory-drives.glb.gz --contract web/accessory-drives-contract.json --policy cad-studies/accessory-drives/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/cylinder-reviewed-20261001.glb.gz --policy cad-studies/cylinder/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/hydraulic-tappet.glb.gz --policy cad-studies/hydraulic-tappet/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/oil-pump.glb.gz --policy cad-studies/oil-pump/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/wright-1903-reconstruction.glb.gz --contract web/wright-1903-reconstruction-contract.json --policy cad-studies/wright-1903/revision-2/interference-policy.json
          python3 scripts/audit_assembly_interference.py web/langley-manly-balzer-1903.glb.gz --contract web/langley-manly-balzer-1903-contract.json --policy cad-studies/langley-manly-balzer-1903/interference-policy.json
      - name: Build the GitHub Pages application
        run: npm run build
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests at phone and tablet widths
        run: npm run e2e
      - name: Keep the browser test traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Publishes what the full run built, on a push to main or a manual run. It depends on the full run alone and names that run's
    # result: by default a job is skipped when any job upstream of it was skipped, and the documentation test (upstream of "verify")
    # is always skipped on a full run, which silently stopped every deploy after the light path was added.
    if: ${{ always() && github.event_name != 'pull_request' && needs.full.result == 'success' }}
    needs: full
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
