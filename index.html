<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061014" />
    <script>
      // Choose the colour theme before first paint, so a light-mode device never flashes dark. src/theme/theme.mjs makes the same
      // decision for the running app, and scripts/test_theme.mjs runs this script to check the two agree.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('4212-theme');
          theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (error) {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (ignored) {}
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#061014' : '#eef4f6');
      })();
    </script>
    <title>Piston Engine Fundamentals</title>
    <meta name="description" content="Interactive 3D study and guided aerospace engineering curriculum for aircraft piston engines." />
    <!-- Installable, and usable offline once visited: the manifest, the icons, and a service worker that only a production build registers
         (src/offline/register.ts). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  </head>
  <body class="bg-canvas text-slate-100 antialiased selection:bg-teal-500/30 selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
